# =====================================================================
# SIVEN · NORCOR — Cargar datos por la API (se ejecuta a mano)
# GitHub → Actions → "Cargar datos" → Run workflow.
# Requiere el secreto SEED_ADMIN_PASSWORD (Settings → Secrets and variables → Actions).
# Los scripts entran con el usuario admin y crean todo por la API, respetando las
# reglas del sistema (movimientos de inventario, numeración y auditoría).
# =====================================================================
name: Cargar datos

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: URL de la API (termina en /api/v1)
        required: true
        default: https://backend-production-8e096a94.up.railway.app/api/v1
      datos:
        description: Qué cargar
        type: choice
        default: productos-reales
        options:
          - productos-reales
          - demo
          - ambos

jobs:
  seed:
    name: Cargar ${{ inputs.datos }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      API_URL: ${{ inputs.api_url }}
      SEED_ADMIN_USERNAME: ${{ vars.SEED_ADMIN_USERNAME || 'admin' }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verificar la configuración
        run: |
          if [ -z "$SEED_ADMIN_PASSWORD" ]; then
            echo "::error::Falta el secreto SEED_ADMIN_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl -fsS "$API_URL/health" || { echo "::error::La API no responde en $API_URL"; exit 1; }

      # Los scripts solo necesitan dotenv; --ignore-scripts evita descargar motores de Prisma.
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Productos reales de NORCOR (173)
        if: inputs.datos != 'demo'
        run: npm run seed:real

      - name: Datos de demostración (usuarios, clientes, ventas…)
        if: inputs.datos != 'productos-reales'
        run: |
          echo "::warning::Los usuarios de demo tienen una contraseña conocida (Siven2026demo!). Desactívelos en producción real."
          node scripts/seed-demo.mjs
