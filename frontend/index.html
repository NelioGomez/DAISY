<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SIVEN — Sistema de Inventario y Ventas de NORCOR" />
    <meta name="theme-color" content="#13283a" />
    <title>SIVEN</title>
    <script>
      /* Tema guardado (claro, oscuro o el del sistema) antes de pintar, para no parpadear en blanco. */
      (function () {
        var p = null;
        try { p = localStorage.getItem('siven.tema'); } catch (e) {}
        var oscuro = p === 'oscuro' || (p !== 'claro' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', oscuro ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
